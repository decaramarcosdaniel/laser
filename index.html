<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Laser Training V3</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"></head><body><header><div><small>LASER TRAINING</small><h1>Detector láser</h1></div><div id="status">● Cámara apagada</div></header><main><section class="card stats"><div><b id="shots">0</b><span>Disparos</span></div><div><b id="score">0</b><span>Puntos</span></div><div><b id="avg">0.0</b><span>Promedio</span></div></section><section class="camera"><video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas><div id="message">Presioná “Activar cámara”.</div></section><section class="buttons"><button id="cameraBtn">📷 Activar cámara</button><button id="calBtn" disabled>🎯 Calibrar</button><button id="sessionBtn" disabled>▶ Iniciar sesión</button><button id="stopBtn" disabled>■ Detener</button></section><section class="card"><h2>Prueba del detector</h2><p>Apuntá el láser rojo al blanco. Cuando el sistema detecte el punto, aparecerá un círculo rojo y se registrará el impacto.</p><div id="debug">Esperando cámara…</div></section><section class="card"><div class="row"><h2>Impactos</h2><button id="clearBtn">Limpiar</button></div><div id="list">Sin impactos.</div></section><section id="error" class="error hidden"></section></main><script src="app.js"></script></body></html>
