<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#080808"><title>Laser Training</title><link rel="stylesheet" href="styles.css"></head><body>
<main id="app">
<section id="home" class="screen home"><div class="brand">LASER<span>TRAINING</span></div><p>Detección automática de impactos con láser</p><button id="start" class="primary">INICIAR</button><small>Usá la cámara trasera y colocá el blanco completo dentro de la imagen.</small></section>
<section id="session" class="screen hidden"><header class="stats"><div><strong id="shots">0</strong><small>DISPAROS</small></div><div><strong id="points">0</strong><small>PUNTOS</small></div><div><strong id="last">—</strong><small>ÚLTIMO</small></div></header>
<div id="stage"><video id="video" autoplay playsinline muted></video><canvas id="overlay"></canvas><div id="status">INICIANDO…</div><div id="targetStatus">BUSCANDO BLANCO</div></div>
<div class="hint">Apuntá al blanco físico · el sistema detecta el punto rojo automáticamente</div>
<footer><button id="pause">PAUSAR</button><button id="finish" class="danger">FINALIZAR</button></footer></section>
<section id="result" class="screen result hidden"><h1>RESULTADO</h1><div class="cards"><div><strong id="rShots">0</strong><small>DISPAROS</small></div><div><strong id="rPoints">0</strong><small>PUNTOS</small></div></div><div id="hits"></div><button id="again" class="primary">NUEVA SESIÓN</button></section>
</main><canvas id="work" width="640" height="480"></canvas><script src="app.js"></script></body></html>
