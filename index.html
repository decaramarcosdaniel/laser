<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>Laser Training</title><link rel="stylesheet" href="styles.css"></head><body><main id="app"><section id="home" class="screen home"><div class="logo">LASER<br><span>TRAINING</span></div><p>Entrenamiento con láser</p><button id="start" class="primary">INICIAR</button><small>Usá la cámara trasera y apuntá al blanco físico.</small></section><section id="session" class="screen session hidden"><div class="top"><div><b id="shots">0</b><span>DISPAROS</span></div><div><b id="points">0</b><span>PUNTOS</span></div><div><b id="last">—</b><span>ÚLTIMO</span></div></div><div id="stage"><video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas><div id="status">INICIANDO CÁMARA…</div><div id="targetBox"></div></div><div class="legend"><span>🔴 Láser detectado</span><span id="detectState">BUSCANDO LÁSER</span></div><div class="controls"><button id="pause">PAUSAR</button><button id="finish" class="danger">FINALIZAR</button></div></section><section id="result" class="screen result hidden"><h1>RESULTADO</h1><div class="big"><b id="rShots">0</b><span>DISPAROS</span></div><div class="big"><b id="rPoints">0</b><span>PUNTOS</span></div><div id="hits"></div><button id="again" class="primary">NUEVA SESIÓN</button></section></main><canvas id="work" width="480" height="360"></canvas><script src="app.js"></script></body></html>
