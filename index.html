<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css">
<title>Laser Training</title>
</head>
<body>
<div id="app">
  <section id="home" class="screen active">
    <div class="brand"><div class="brand-mark">●</div><h1>LASER TRAINING</h1><p>Entrenamiento con láser</p></div>
    <button id="start" class="primary">INICIAR</button>
    <p class="hint">La cámara se abrirá al iniciar.</p>
    <p id="homeError" class="error hidden"></p>
  </section>

  <section id="session" class="screen">
    <div class="camera-wrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div id="cameraStatus" class="camera-status">INICIANDO CÁMARA…</div>
      <div class="topbar">
        <span id="shotCount">0 DISPAROS</span>
        <span id="liveScore">0 PTS</span>
      </div>
      <button id="finish" class="finish">FINALIZAR</button>
    </div>

    <div class="dashboard">
      <div class="stat"><small>DISPAROS</small><b id="shots">0</b></div>
      <div class="stat"><small>PUNTOS</small><b id="points">0</b></div>
      <div class="stat"><small>PROMEDIO</small><b id="average">0.0</b></div>
    </div>

    <div class="target-card">
      <div class="target-head"><b>IMPACTOS</b><span id="last">—</span></div>
      <div class="target-view"><img id="target" src="assets/blanco.jpg" alt="Blanco de tiro"><canvas id="targetMarks"></canvas></div>
    </div>
  </section>

  <section id="result" class="screen">
    <div class="result-box"><span>RESULTADO</span><strong id="totalResult">0</strong><small>PUNTOS</small></div>
    <div class="result-grid">
      <div><small>DISPAROS</small><b id="resultShots">0</b></div>
      <div><small>PROMEDIO</small><b id="resultAverage">0.0</b></div>
      <div><small>MEJOR</small><b id="resultBest">0</b></div>
    </div>
    <button id="again" class="primary">NUEVA SESIÓN</button>
  </section>
</div>
<script src="app.js"></script>
</body></html>
