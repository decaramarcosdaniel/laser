<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#080b10"><title>Laser Training</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"></head><body><div id="app"><header><div><small>LASER TRAINING</small><h1>Detector láser</h1></div><b id="state">CÁMARA OFF</b></header><main><section class="camera"><video id="video" autoplay playsinline muted></video><canvas id="overlay"></canvas><div id="cover"><div>📷</div><h2>Activar cámara</h2><p>Usaremos la cámara trasera del iPhone.</p><button id="start">ACTIVAR CÁMARA</button></div><div id="laser">● ESPERANDO LÁSER</div></section><div class="buttons"><button id="cal" disabled>🎯 CALIBRAR</button><button id="session" disabled>▶ SESIÓN</button><button id="stop" disabled>■ DETENER</button><button id="restart">↻ REINICIAR</button></div><section class="stats"><div><b id="shots">0</b><small>DISPAROS</small></div><div><b>—</b><small>PUNTOS</small></div><div><b>—</b><small>PROMEDIO</small></div><div><b id="fps">0</b><small>FPS</small></div></section><section class="panel"><h2>Detector</h2><p id="info">La cámara todavía no está activa.</p><label>Sensibilidad <b id="sv">72%</b></label><input id="sens" type="range" min="45" max="92" value="72"><label>Área mínima <b id="av">5</b></label><input id="area" type="range" min="1" max="60" value="5"><label>Bloqueo <b id="cv">500 ms</b></label><input id="cool" type="range" min="150" max="1200" step="50" value="500"></section><section class="panel"><div class="head"><h2>Detecciones</h2><button id="clear">Limpiar</button></div><div id="list">Sin detecciones.</div></section></main><canvas id="processor"></canvas></div><script src="app.js"></script></body></html>
