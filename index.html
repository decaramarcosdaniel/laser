<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
<title>Laser Training V17</title>
</head>
<body>
<main>
<section id="home" class="home">
  <h1>LASER <span>TRAINING</span></h1>
  <p>Prueba de cámara</p>
  <button id="start" class="primary">INICIAR</button>
</section>

<section id="session" class="session hidden">
  <div class="camera">
    <video id="video" autoplay playsinline muted webkit-playsinline></video>
    <div class="cameraShade"></div>
    <div class="cameraStatus"><span class="dot"></span><span id="state">ABRIENDO CÁMARA…</span></div>
  </div>

  <div class="targetArea">
    <div class="targetTitle">BLANCO DE PRUEBA</div>
    <div class="targetStage">
      <img id="target" src="assets/blanco.jpg" alt="Blanco">
      <div id="loadError" class="error hidden">NO SE CARGÓ EL BLANCO</div>
    </div>
  </div>

  <div class="buttons">
    <button id="finish" class="danger">FINALIZAR</button>
  </div>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
